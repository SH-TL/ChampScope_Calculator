<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>챔프스코프 계산기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#14243a;font:16px system-ui,sans-serif}header{background:#14243a;color:white;padding:40px max(24px,calc((100% - 1180px)/2))}header small{color:#55d6be;font-weight:bold}header a{color:white}main{max-width:1180px;margin:auto;padding:24px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border:1px solid #dce4ed;border-radius:12px;padding:20px;margin-bottom:20px}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:8px;border:1px solid #ccd6e1;border-radius:6px}input,select{width:100%}button{background:#14243a;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}td input{min-width:55px}output{font-size:24px;font-weight:bold}p{line-height:1.6}@media(max-width:700px){.cols{grid-template-columns:1fr}}
</style><header><a href="https://champscope.wordpress.com/">챔프스코프</a><p><small>BATTLE CALCULATOR</small></p><h1>데미지 계산기</h1><p>포켓몬의 능력치와 배틀 조건을 설정하여 데미지를 비교하세요.</p></header><main><p>싱글 배틀 · Lv.50 · 초기 테스트 버전</p><section><h2>배틀 설정</h2><label>날씨<select id="weather"><option value="1">없음</option><option value="sun">쾌청</option><option value="rain">비</option></select></label></section><div class="cols"><section><h2>공격 측</h2><label>포켓몬 이름<input value="한카리아스"></label><label>공격 또는 특수공격 실수치<input type="number" id="atk" min="1" max="999" value="182"></label><label>공격 랭크<input type="number" id="ar" min="-6" max="6" value="0"></label><h3>공격 기술</h3><label>기술 위력<input type="number" id="bp" min="1" max="999" value="100"></label><label>기술 타입<select id="type"><option value="other">기타</option><option value="fire">불꽃</option><option value="water">물</option></select></label><label>분류<select id="category"><option value="physical">물리</option><option value="special">특수</option></select></label><label>자속 보정<select id="stab"><option value="1">없음</option><option value="1.5" selected>1.5배</option><option value="2">2배</option></select></label><label>급소<select id="crit"><option value="0">아니오</option><option value="1">예</option></select></label><label>화상<select id="burn"><option value="0">아니오</option><option value="1">예</option></select></label></section><section><h2>방어 측</h2><label>포켓몬 이름<input value="보만다"></label><label>HP 실수치<input type="number" id="hp" min="1" max="999" value="170"></label><label>방어 또는 특수방어 실수치<input type="number" id="def" min="1" max="999" value="100"></label><label>방어 랭크<input type="number" id="dr" min="-6" max="6" value="0"></label><label>타입 상성<select id="eff"><option>0</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label><label>벽<select id="wall"><option value="none">없음</option><option value="reflect">리플렉터</option><option value="light">빛의장막</option><option value="veil">오로라베일</option></select></label></section></div><section><h2>계산 결과</h2><button id="go">계산</button><p><output id="result"></output></p><p id="rolls"></p><p>실수치와 타입 상성을 직접 입력하는 시험판입니다. 특성·도구·SP·기술별 예외 및 챔피언스 전용 엔진은 아직 연결되지 않았습니다. 실전 정확성을 보장하지 않습니다.</p></section></main><script>
const el=id=>document.getElementById(id),n=id=>Number(el(id).value),v=id=>el(id).value, f=Math.floor, pr=x=>Math.ceil(x-.5),rank=(s,r)=>f(s*(r>=0?(2+r)/2:2/(2-r)));
function run(){for(const id of ['atk','def','hp','bp','ar','dr'])if(!el(id).checkValidity()){el('result').textContent='입력값을 확인하세요';return}let c=n('crit'),a=rank(n('atk'),c?Math.max(0,n('ar')):n('ar')),d=Math.max(1,rank(n('def'),c?Math.min(0,n('dr')):n('dr'))),base=f(f(22*n('bp')*a/d)/50)+2;let w=v('weather'),t=v('type');if((w==='sun'&&t==='fire')||(w==='rain'&&t==='water'))base=pr(base*1.5);if((w==='sun'&&t==='water')||(w==='rain'&&t==='fire'))base=pr(base*.5);if(c)base=f(base*1.5);let physical=v('category')==='physical',wall=v('wall'),screen=!c&&(wall==='veil'||(physical?wall==='reflect':wall==='light'));let rolls=Array.from({length:16},(_,i)=>{let x=f(base*(85+i)/100);x=pr(x*n('stab'));x=f(x*n('eff'));if(physical&&n('burn'))x=f(x/2);if(screen)x=pr(x/2);return n('eff')===0?0:Math.max(1,x)});let lo=rolls[0],hi=rolls[15],hp=n('hp');el('result').textContent=lo+' ~ '+hi+' ('+(lo/hp*100).toFixed(1)+' ~ '+(hi/hp*100).toFixed(1)+'%)';el('rolls').textContent='16개 난수: '+rolls.join(', ')+' / '+(hi===0?'무효':Math.ceil(hp/hi)+'~'+Math.ceil(hp/lo)+'타 (회복 제외)')}
el('go').onclick=run;run();
</script></html>
