<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>챔프스코프 계산기</title><style>*{box-sizing:border-box}body{margin:0;color:#14243a;background:white;font:16px system-ui,sans-serif}header{padding:40px 24px;background:#14243a;color:#fff}header>div{max-width:1180px;margin:auto}header small{color:#55d6be}header p{color:#dce7f2}main{max-width:1180px;margin:auto;padding:20px 24px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{border:1px solid #dce4ed;border-radius:12px;padding:20px;margin-bottom:20px;min-width:0}h3{margin:0 0 16px}table{width:100%;border-collapse:collapse;margin:12px 0 20px}td,th{padding:8px;text-align:left;font-size:14px}tr:nth-child(odd){background:#f3f4f5}input,select,button{font:inherit;color:inherit;border:1px solid #dce4ed;border-radius:6px;background:white;padding:8px;max-width:100%}input,select{width:100%}.stats input,.stats select{min-width:48px;padding:5px}.picker{position:relative}.options{position:absolute;z-index:5;left:0;right:0;top:100%;max-height:200px;overflow-y:auto;background:white;border:1px solid #dce4ed;box-shadow:0 4px 12px #0002}.options button{display:block;width:100%;height:40px;text-align:left;border:0;border-radius:0}.options button:hover{background:#e3f5f1}.pills{background:#f1f1f1;border-radius:20px;padding:6px 8px;margin:8px 0}.pills button{border:0;border-radius:20px;margin:2px;padding:4px 12px;font-size:13px}.pills button.active{background:#14243a;color:white}.pills button:disabled{opacity:.5}.result{background:#f1f5f9}#go{background:#14243a;color:white;cursor:pointer}a{color:inherit}@media(max-width:760px){.cols{grid-template-columns:1fr}main{padding:12px}section{padding:12px}}</style><header><div><small>BATTLE CALCULATOR</small><h1>데미지 계산기</h1><p>포켓몬의 능력치와 배틀 조건을 설정하여 데미지를 비교하세요.</p></div></header><main><p>Regulation M-C　·　Lv.50　·　기본 계산 시험판</p><section><h3>배틀 설정</h3><table><tr><td>날씨</td><td><select id="weather"><option value="">없음</option><option value="sun">쾌청</option><option value="rain">비</option><option value="sand">모래바람</option><option value="snow">눈</option></select></td></tr><tr><td>필드</td><td><select id="terrain"><option value="">없음</option><option>일렉트릭필드</option><option>그래스필드</option><option>사이코필드</option><option>미스트필드</option></select></td></tr></table></section><div class="cols"><section id="a"></section><section id="d"></section></div><section class="result"><h3>계산 결과</h3><p>공격 측 ↔ 방어 측　｜　<button id="go">계산</button></p><table><tr><th>예상 데미지</th><th>데미지 비율</th><th>확정 / 난수 타수</th></tr><tr><td id="damage">—</td><td id="percent">—</td><td id="ko">—</td></tr></table><p id="rolls"></p><p id="warning">초기 시험판: 기본 종족값과 기술만 적용하며 챔피언스 시즌 전체 목록 및 특성·도구 예외는 미검증입니다.</p><a href="https://champscope.wordpress.com/">챔프스코프 홈</a></section></main><script>
const E=id=>document.getElementById(id), F=Math.floor, pr=x=>Math.ceil(x-.5), labels=['HP','공격','방어','특수공격','특수방어','스피드'];
const dex=[['한카리아스','Dragon Ground',108,130,95,80,85,102],['한바이트','Dragon Ground',68,90,65,50,55,82],['딥상어동','Dragon Ground',58,70,45,40,45,42],['보만다','Dragon Flying',95,135,80,110,80,100],['망나뇽','Dragon Flying',91,134,95,100,100,80],['피카츄','Electric',35,55,40,50,50,90],['리자몽','Fire Flying',78,84,78,109,85,100],['이상해꽃','Grass Poison',80,82,83,100,100,80],['거북왕','Water',79,83,100,85,105,78],['팬텀','Ghost Poison',60,65,60,130,75,110],['루카리오','Fighting Steel',70,110,70,115,70,90],['마기라스','Rock Dark',100,134,110,95,100,61],['메타그로스','Steel Psychic',80,135,130,95,90,70],['따라큐','Ghost Fairy',55,90,80,50,105,96],['킬가르도','Steel Ghost',60,50,140,50,140,60],['마릴리','Water Fairy',100,50,80,60,80,50],['드래펄트','Dragon Ghost',88,120,75,100,75,142],['한카리아스(메가)','Dragon Ground',108,170,115,120,95,92],['보만다(메가)','Dragon Flying',95,145,130,120,90,120],['핫삼','Bug Steel',70,130,100,55,80,65],['한카리아스(메가Z)','Dragon Ground',108,0,0,0,0,0]].filter(p=>p[3]>0);
const types={Normal:'노말',Fire:'불꽃',Water:'물',Electric:'전기',Grass:'풀',Ice:'얼음',Fighting:'격투',Poison:'독',Ground:'땅',Flying:'비행',Psychic:'에스퍼',Bug:'벌레',Rock:'바위',Ghost:'고스트',Dragon:'드래곤',Dark:'악',Steel:'강철',Fairy:'페어리'};
const chart={Normal:['','Rock Steel','Ghost'],Fire:['Grass Ice Bug Steel','Fire Water Rock Dragon',''],Water:['Fire Ground Rock','Water Grass Dragon',''],Electric:['Water Flying','Electric Grass Dragon','Ground'],Grass:['Water Ground Rock','Fire Grass Poison Flying Bug Dragon Steel',''],Ice:['Grass Ground Flying Dragon','Fire Water Ice Steel',''],Fighting:['Normal Ice Rock Dark Steel','Poison Flying Psychic Bug Fairy','Ghost'],Poison:['Grass Fairy','Poison Ground Rock Ghost','Steel'],Ground:['Fire Electric Poison Rock Steel','Grass Bug','Flying'],Flying:['Grass Fighting Bug','Electric Rock Steel',''],Psychic:['Fighting Poison','Psychic Steel','Dark'],Bug:['Grass Psychic Dark','Fire Fighting Poison Flying Ghost Steel Fairy',''],Rock:['Fire Ice Flying Bug','Fighting Ground Steel',''],Ghost:['Psychic Ghost','Dark','Normal'],Dragon:['Dragon','Steel','Fairy'],Dark:['Psychic Ghost','Fighting Dark Fairy',''],Steel:['Ice Rock Fairy','Fire Water Electric Steel',''],Fairy:['Fighting Dragon Dark','Fire Poison Steel','']};
const nature=[['무보정',0,0],['고집',1,3],['명랑',5,3],['조심',3,1],['겁쟁이',5,1],['대담',2,1],['차분',4,1],['장난꾸러기',2,3],['신중',4,3],['용감',1,5],['냉정',3,5],['건방',4,5],['무사태평',2,5],['외로움',1,2],['개구쟁이',1,4],['성급',5,2],['천진난만',5,4],['의젓',3,2],['덜렁',3,4],['얌전',4,2],['촐랑',2,4]];
const moves=[['지진','Ground','물리',100],['드래곤클로','Dragon','물리',80],['역린','Dragon','물리',120],['용성군','Dragon','특수',130],['화염방사','Fire','특수',90],['냉동빔','Ice','특수',90],['10만볼트','Electric','특수',90],['파도타기','Water','특수',90],['섀도볼','Ghost','특수',80],['문포스','Fairy','특수',95],['인파이트','Fighting','물리',120],['아이언헤드','Steel','물리',80],['스톤에지','Rock','물리',100],['에너지볼','Grass','특수',90],['악의파동','Dark','특수',80],['사이코키네시스','Psychic','특수',90],['유턴','Bug','물리',70],['독찌르기','Poison','물리',80],['제비반환','Flying','물리',60],['몸통박치기','Normal','물리',40]];
const selected={a:dex[0],d:dex[3]},row=(k,v)=>'<tr><td>'+k+'</td><td>'+v+'</td></tr>',sel=(id,opts)=>'<select id="'+id+'">'+opts.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')+'</select>',pills=(arr)=>'<div class="pills">'+arr.map(x=>'<button type="button" data-effect="'+x+'" '+(['급소','충전','리플렉터','빛의장막','오로라베일'].includes(x)?'':'disabled title="아직 미지원"')+'>'+x+'</button>').join('')+'</div>';
for(const s of ['a','d']){E(s).innerHTML='<h3>'+(s==='a'?'공격 측':'방어 측')+'</h3><table>'+row('포켓몬','<div class="picker"><input id="'+s+'search" autocomplete="off" placeholder="포켓몬 검색"><div class="options" id="'+s+'options" hidden></div></div>')+row('타입','<span id="'+s+'types"></span>')+row('특성','<select disabled><option>미지원</option></select>')+row('도구','<select disabled><option>미지원</option></select>')+row('성격',sel(s+'nature',nature.map(x=>x[0])))+row('상태이상',sel(s+'status',['없음','화상','마비','독','잠듦','얼음']))+'</table><h3>능력치 · Lv.50</h3><table class="stats"><tr><th>능력치</th><th>종족값</th><th>SP</th><th>실수치</th><th>랭크</th></tr>'+labels.map((x,i)=>'<tr><td>'+x+'</td><td id="'+s+'base'+i+'"></td><td><input aria-label="'+x+' SP" type="number" min="0" max="32" value="0" id="'+s+'sp'+i+'"></td><td id="'+s+'stat'+i+'"></td><td>'+(i?'<select id="'+s+'rank'+i+'">'+Array.from({length:13},(_,j)=>'<option value="'+(j-6)+'" '+(j===6?'selected':'')+'>'+(j-6)+'</option>').join('')+'</select>':'—')+'</td></tr>').join('')+'</table><p id="'+s+'total"></p>'+(s==='a'?'<h3>공격 기술</h3><table>'+row('기술',sel('move',moves.map(x=>x[0])))+row('타입 / 분류','<span id="moveinfo"></span>')+row('위력 / 타수','<span id="power"></span> / 1')+'</table>'+pills(['급소','충전','도우미','배터리'])+pills(['파워스폿','플라워기프트','강철정신'])+pills(['페어리오라','다크오라','오라브레이크'])+pills(['재앙의목간','재앙의검','재앙의그릇','재앙의구슬']):'<h3>방어 조건</h3><table>'+row('현재 HP','<input id="current" type="number" min="1" max="100" value="100"> %')+row('추가 효과','<label><input style="width:auto" id="rocks" type="checkbox"> 스텔스록</label>')+'</table>'+pills(['리플렉터','빛의장막','오로라베일','프렌드가드']));
const input=E(s+'search'),box=E(s+'options');input.value=selected[s][0];function show(q){box.replaceChildren();for(const p of dex.filter(p=>p[0].startsWith(q)).sort((a,b)=>a[0].localeCompare(b[0],'ko'))){let b=document.createElement('button');b.type='button';b.textContent=p[0];b.onmousedown=e=>e.preventDefault();b.onclick=()=>{selected[s]=p;input.value=p[0];box.hidden=true;run()};box.append(b)}if(!box.children.length)box.textContent='검색 결과 없음';box.hidden=false}input.onfocus=()=>{input.select();show('')};input.oninput=()=>show(input.value.trim());input.onblur=()=>setTimeout(()=>{box.hidden=true;input.value=selected[s][0]},150);
for(let i=0;i<6;i++)E(s+'sp'+i).oninput=()=>{let other=labels.reduce((t,_,j)=>t+(j===i?0:Number(E(s+'sp'+j).value)||0),0),n=Number(E(s+'sp'+i).value)||0;E(s+'sp'+i).value=Math.max(0,Math.min(32,66-other,F(n)));run()}}
function stats(s){let p=selected[s],nat=nature[+E(s+'nature').value],total=0;E(s+'types').textContent=p[1].split(' ').map(t=>types[t]).join(' / ');let a=labels.map((_,i)=>{let sp=+E(s+'sp'+i).value;total+=sp;let value=i?F((p[i+2]+20+sp)*(nat[1]===i?110:nat[2]===i?90:100)/100):p[2]+75+sp;E(s+'base'+i).textContent=p[i+2];E(s+'stat'+i).textContent=value;return value});E(s+'total').textContent='사용 포인트  '+total+' / 66';return a}
function eff(t,p){let c=chart[t];return p[1].split(' ').reduce((v,k)=>v*(c[2].split(' ').includes(k)?0:c[0].split(' ').includes(k)?2:c[1].split(' ').includes(k)?.5:1),1)}const on=x=>!!document.querySelector('[data-effect="'+x+'"].active'),rank=(v,r)=>F(v*(r>=0?(2+r)/2:2/(2-r)));
function run(){let a=stats('a'),d=stats('d'),m=moves[+E('move').value],physical=m[2]==='물리',ai=physical?1:3,di=physical?2:4,c=on('급소'),ar=+E('arank'+ai).value,dr=+E('drank'+di).value,atk=rank(a[ai],c?Math.max(0,ar):ar),def=rank(d[di],c?Math.min(0,dr):dr),w=E('weather').value,t=m[1],power=m[3],ap=selected.a[1].split(' '),dp=selected.d[1].split(' ');E('moveinfo').textContent=types[t]+' / '+m[2];E('power').textContent=power;if(w==='sand'&&!physical&&dp.includes('Rock'))def=pr(def*1.5);if(w==='snow'&&physical&&dp.includes('Ice'))def=pr(def*1.5);if(on('충전')&&t==='Electric')power*=2;let b=F(F(22*power*atk/Math.max(1,def))/50)+2;if((w==='sun'&&t==='Fire')||(w==='rain'&&t==='Water'))b=pr(b*1.5);if((w==='sun'&&t==='Water')||(w==='rain'&&t==='Fire'))b=pr(b*.5);if(c)b=F(b*1.5);let e=eff(t,selected.d),screen=!c&&(on('오로라베일')||(physical?on('리플렉터'):on('빛의장막')));let rolls=Array.from({length:16},(_,i)=>{let x=F(b*(85+i)/100);if(ap.includes(t))x=pr(x*1.5);x=F(x*e);if(physical&&E('astatus').value==='1')x=F(x/2);if(screen)x=pr(x/2);return e?Math.max(1,x):0});let lo=rolls[0],hi=rolls[15],hp=Math.max(1,F(d[0]*Math.max(1,Math.min(100,+E('current').value||100))/100));if(E('rocks').checked)hp=Math.max(0,hp-F(d[0]*eff('Rock',selected.d)/8));E('damage').textContent=lo+' ~ '+hi;E('percent').textContent=(lo/d[0]*100).toFixed(1)+' ~ '+(hi/d[0]*100).toFixed(1)+'%';E('ko').textContent=hp===0?'이미 기절':hi===0?'무효':Math.ceil(hp/hi)+' ~ '+Math.ceil(hp/lo)+'타';E('rolls').textContent='16개 난수: '+rolls.join(', ')+(hi?' / 1타 확률 '+(rolls.filter(x=>x>=hp).length/16*100).toFixed(2)+'%':'');E('warning').textContent='기본 계산 시험판 · 특성/도구 및 시즌별 기술 예외 미지원'+(E('terrain').value!=='0'&&E('terrain').value!==''?' · 필드 효과 미지원':'')}
document.querySelectorAll('select,#current,#rocks').forEach(x=>x.addEventListener('change',run));document.querySelectorAll('.pills button:not(:disabled)').forEach(x=>x.onclick=()=>{x.classList.toggle('active');run()});E('go').onclick=run;run();
</script></html>
